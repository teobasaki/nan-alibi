<!doctype html>
<meta charset="utf-8">
<title>precinct probe 3 (temp)</title>
<style>
  body { background:#111; color:#ddd; font:12px system-ui; margin:0; padding:8px }
  figure { margin:0 0 10px } figcaption { padding:4px 0; white-space:pre; color:#ffd9a0 }
  pre { background:#000; padding:8px; max-height:300px; overflow:auto }
</style>
<pre id="log"></pre>
<div id="row"></div>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js'
import { clone as skClone } from 'three/examples/jsm/utils/SkeletonUtils.js'

const L = (s) => { document.getElementById('log').textContent += s + '\n' }
const W = 787, H = 560
const draco = new DRACOLoader().setDecoderPath('/draco/')
const loader = new GLTFLoader().setDRACOLoader(draco)
const roomSrc = await loader.loadAsync('/room/room.opt.glb')
const SCALE = 1.9, PITCH = 3.458
const WALKERS = ['security','investor','appraiser','expartner','secretary','housekeeping','nephew']
const walk = {}
for (const s of WALKERS) walk[s] = await loader.loadAsync(`/characters/${s}.walk.opt.glb`)

L('=== 걷기 모델 실측 ===')
for (const s of WALKERS) {
  const g = walk[s]
  const m = g.scene.clone(true)
  const b = new THREE.Box3().setFromObject(m)
  const cl = g.animations[0]
  L(`${s.padEnd(13)} y[${b.min.y.toFixed(3)}, ${b.max.y.toFixed(3)}] 높이=${(b.max.y-b.min.y).toFixed(3)} 클립="${cl?.name}" ${cl?.duration.toFixed(2)}s 트랙=${cl?.tracks.length}`)
}

function makeRoom({ ceiling=false, furniture=true, props=true, door=true, tint=1, side=null } = {}) {
  const room = roomSrc.scene.clone(true)
  room.scale.setScalar(SCALE); room.position.y = 0.53 * SCALE
  room.traverse((o) => {
    if (!o.isMesh) return
    const src = Array.isArray(o.material) ? o.material[0] : o.material
    const m = src.clone()
    m.emissive?.setScalar(0); m.emissiveMap = null
    m.color.multiplyScalar(0.68 * tint)
    m.roughness = Math.min(Math.max(m.roughness, 0.68), 0.9)
    m.metalness = Math.min(m.metalness, 0.35)
    if (side) m.side = side
    o.material = m
    if (src.name === 'lambert4SG' && !ceiling) o.visible = false
    if (src.name === 'lambert3SG' && !furniture) o.visible = false
    if (src.name === 'lambert5SG' && !props) o.visible = false
    if (src.name === 'lambert2SG' && !door) o.visible = false
  })
  return room
}
/** 걷기 모델을 특정 클립 시각의 포즈로 고정해 세운다 */
function stand(slug, x, z, yaw, t) {
  const src = walk[slug]
  const m = skClone(src.scene)      // .clone(true) 는 스켈레톤을 공유해 전부 원본 자리에 겹친다
  const mix = new THREE.AnimationMixer(m)
  const a = mix.clipAction(src.animations[0])
  a.play(); mix.setTime(t)          // 이 시각의 포즈로 굳는다
  m.updateMatrixWorld(true)
  const b = new THREE.Box3().setFromObject(m)
  m.scale.setScalar(1.7 / (b.max.y - b.min.y))
  m.rotation.y = yaw
  m.updateMatrixWorld(true)
  const b2 = new THREE.Box3().setFromObject(m)
  m.position.y -= b2.min.y
  m.position.x += x - (b2.max.x + b2.min.x) / 2
  m.position.z += z - (b2.max.z + b2.min.z) / 2
  return m
}
function lights(scene, xs) {
  scene.add(new THREE.AmbientLight(0xffd9b0, 0.6))
  for (const x of xs) { const p = new THREE.PointLight(0xffcf9a, 13, 7.5, 2); p.position.set(x+0.05, 1.75, 0.02); scene.add(p) }
}
const ONLY = location.hash.replace('#','')
function panel(label, build) {
  if (ONLY && !label.startsWith(ONLY)) return
  const fig = document.createElement('figure')
  const cap = document.createElement('figcaption'); cap.textContent = label
  fig.appendChild(cap)
  const r = new THREE.WebGLRenderer({ antialias: true })
  r.setPixelRatio(1); r.setSize(W, H)
  r.outputColorSpace = THREE.SRGBColorSpace
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15
  fig.appendChild(r.domElement)
  document.getElementById('row').appendChild(fig)
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0908)
  const cam = build(scene)
  r.render(scene, cam)
}
function iso(view, target, yawDeg, pitchDeg, dist = 14) {
  const c = new THREE.OrthographicCamera(-view*(W/H)/2, view*(W/H)/2, view/2, -view/2, 0.1, 90)
  const y = yawDeg*Math.PI/180, p = pitchDeg*Math.PI/180
  c.position.set(target.x + dist*Math.cos(p)*Math.sin(y), target.y + dist*Math.sin(p), target.z + dist*Math.cos(p)*Math.cos(y))
  c.lookAt(target); return c
}

// P: 걷기 클립의 여러 시각 포즈 — 어느 프레임이 "서 있는" 것으로 읽히나
panel('P  포즈 샘플 t=0 .2 .4 .6 .8 1.0 (security)', (s) => {
  const d = walk.security.animations[0].duration
  for (let i = 0; i < 6; i++) s.add(stand('security', -2.2 + i*0.9, 0, 0.35, d*i/6))
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(12,6).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({color:0x33291f})))
  lights(s, [-1.5, 1.5]); return iso(3.2, new THREE.Vector3(0,0.85,0), 12, 12)
})

// 3칸 경찰서 + 대기 중인 용의자 5명 (걷기 모델 = 전신, 잘림 없음)
function precinct(scene, { side=null, walkers=true } = {}) {
  const wait = makeRoom({ furniture:false, side }); wait.position.x = -PITCH
  const hall = makeRoom({ furniture:false, props:false, tint:0.92, side })
  const intr = makeRoom({ side }); intr.position.x = PITCH
  scene.add(wait, hall, intr)
  if (walkers) {
    const five = ['security','investor','appraiser','expartner','secretary']
    const spot = [[-1.15,-1.30],[-0.35,-1.45],[0.50,-1.25],[1.15,-0.35],[-1.30,0.55]]
    const d = walk.security.animations[0].duration
    five.forEach((s, i) => scene.add(stand(s, -PITCH + spot[i][0], spot[i][1], 0.15 + i*0.5, d * (0.5 + i*0.03))))
  }
  scene.add(stand('nephew', 0, 0.45, 0.6, 0))    // 플레이어(형사) 자리
  lights(scene, [-PITCH, 0, PITCH])
}
panel('Q1  3칸 전경 yaw20 pitch40 view=11 (걷기모델 5명 대기)', (s) => { precinct(s); return iso(11, new THREE.Vector3(0,0.75,0), 20, 40) })
panel('Q2  3칸 전경 + FrontSide', (s) => { precinct(s, { side: THREE.FrontSide }); return iso(11, new THREE.Vector3(0,0.75,0), 20, 40) })
panel('Q3  대기실 추종 view=5.0 (카메라가 방을 따라간다)', (s) => { precinct(s); return iso(5.0, new THREE.Vector3(-PITCH,0.85,-0.3), 20, 40) })
panel('Q4  이송 중간 프레임 view=7 target x=-1.7', (s) => { precinct(s); return iso(7, new THREE.Vector3(-1.7,0.85,-0.1), 20, 40) })
panel('Q5  취조실 도착 view=5.0', (s) => { precinct(s); return iso(5.0, new THREE.Vector3(PITCH,0.85,-0.3), 20, 40) })
L('done')
</script>
