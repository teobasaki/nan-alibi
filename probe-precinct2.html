<!doctype html>
<meta charset="utf-8">
<title>precinct probe 2 (temp)</title>
<style>
  body { background:#111; color:#ddd; font:12px system-ui; margin:0; padding:8px }
  figure { margin:0 0 10px } figcaption { padding:4px 0; white-space:pre; color:#ffd9a0 }
  pre { background:#000; padding:8px; max-height:280px; overflow:auto }
</style>
<pre id="log"></pre>
<div id="row"></div>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js'

const L = (s) => { document.getElementById('log').textContent += s + '\n' }
const W = 787, H = 560          // 실제 좌면 3D 호스트 크기
const draco = new DRACOLoader().setDecoderPath('/draco/')
const loader = new GLTFLoader().setDRACOLoader(draco)
const roomSrc = await loader.loadAsync('/room/room.opt.glb')

const SCALE = 1.9, PITCH = 3.458
const SITTERS = ['secretary','appraiser','nephew','housekeeping','investor']
const sit = {}
for (const s of SITTERS) sit[s] = await loader.loadAsync(`/characters/${s}.opt.glb`)
const walkG = await loader.loadAsync('/characters/security.walk.opt.glb')

// ── 착석 모델 실측 ──
L('=== 착석 모델 원본 bbox (스케일 1) ===')
const SITBOX = {}
for (const s of SITTERS) {
  const m = sit[s].scene.clone(true)
  const b = new THREE.Box3().setFromObject(m)
  SITBOX[s] = b
  L(`${s.padEnd(13)} y[${b.min.y.toFixed(3)}, ${b.max.y.toFixed(3)}]  높이=${(b.max.y-b.min.y).toFixed(3)}  x폭=${(b.max.x-b.min.x).toFixed(2)} z폭=${(b.max.z-b.min.z).toFixed(2)}`)
}

function makeRoom({ ceiling=false, furniture=true, props=true, door=true, side=null, tint=1 } = {}) {
  const room = roomSrc.scene.clone(true)
  room.scale.setScalar(SCALE); room.position.y = 0.53 * SCALE
  room.traverse((o) => {
    if (!o.isMesh) return
    const src = Array.isArray(o.material) ? o.material[0] : o.material
    const m = src.clone()
    m.emissive?.setScalar(0); m.emissiveMap = null
    m.color.multiplyScalar(0.68 * tint)
    m.roughness = Math.min(Math.max(m.roughness, 0.68), 0.9)
    m.metalness = Math.min(m.metalness, 0.35)
    if (side) m.side = side
    o.material = m
    if (src.name === 'lambert4SG' && !ceiling) o.visible = false
    if (src.name === 'lambert3SG' && !furniture) o.visible = false
    if (src.name === 'lambert5SG' && !props) o.visible = false
    if (src.name === 'lambert2SG' && !door) o.visible = false
  })
  return room
}
/** 착석 모델을 벤치 위에 앉힌다 — 잘린 모델은 벤치가 단면을 가린다 */
function seat(slug, x, z, yaw, benchTopY) {
  const m = sit[slug].scene.clone(true)
  const b0 = new THREE.Box3().setFromObject(m)
  const sz = b0.getSize(new THREE.Vector3())
  const sc = sz.y > 1.55 ? 1.72 / sz.y : 1
  m.scale.setScalar(sc)
  m.rotation.y = yaw
  m.updateMatrixWorld(true)
  const b = new THREE.Box3().setFromObject(m)
  // 정수리를 앉은 사람 눈높이(벤치면 + 0.85m)에 맞춘다 — 키 정규화
  m.position.y += (benchTopY + 0.85) - b.max.y
  m.position.x += x - (b.max.x + b.min.x) / 2
  m.position.z += z - (b.max.z + b.min.z) / 2
  m.updateMatrixWorld(true)
  const f = new THREE.Box3().setFromObject(m)
  L(`  seat ${slug.padEnd(13)} 최종 x[${f.min.x.toFixed(2)},${f.max.x.toFixed(2)}] y[${f.min.y.toFixed(2)},${f.max.y.toFixed(2)}] z[${f.min.z.toFixed(2)},${f.max.z.toFixed(2)}]  scale=${sc.toFixed(2)}`)
  return m
}
function bench(x, z, w, d, topY) {
  const g = new THREE.Group()
  const mat = new THREE.MeshStandardMaterial({ color: 0x6b5340, roughness: 0.85, metalness: 0.05 })
  const seatM = new THREE.Mesh(new THREE.BoxGeometry(w, 0.09, d), mat)
  seatM.position.set(x, topY - 0.045, z); g.add(seatM)
  const backM = new THREE.Mesh(new THREE.BoxGeometry(w, 0.55, 0.07), mat)
  backM.position.set(x, topY + 0.27, z - d/2 + 0.035); g.add(backM)
  for (const sx of [-w/2+0.08, w/2-0.08]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07, topY-0.09, d*0.8), mat)
    leg.position.set(x+sx, (topY-0.09)/2, z); g.add(leg)
  }
  return g
}
function player(x, z) {
  const a = walkG.scene.clone(true)
  const b = new THREE.Box3().setFromObject(a)
  a.scale.setScalar(1.7 / (b.max.y - b.min.y))
  a.position.set(x, 0, z)
  return a
}
function lights(scene, xs) {
  scene.add(new THREE.AmbientLight(0xffd9b0, 0.55))
  for (const x of xs) {
    const p = new THREE.PointLight(0xffcf9a, 13, 7.5, 2)
    p.position.set(x + 0.05, 1.75, 0.02); scene.add(p)
  }
}
const ONLY = location.hash.replace('#','')
function panel(label, build) {
  if (ONLY && !label.startsWith(ONLY)) return
  const fig = document.createElement('figure')
  const cap = document.createElement('figcaption'); cap.textContent = label
  fig.appendChild(cap)
  const r = new THREE.WebGLRenderer({ antialias: true })
  r.setPixelRatio(1); r.setSize(W, H)
  r.outputColorSpace = THREE.SRGBColorSpace
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15
  fig.appendChild(r.domElement)
  document.getElementById('row').appendChild(fig)
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0908)
  const cam = build(scene, r)
  r.render(scene, cam)
}
/** yaw/pitch 를 각도로 주는 정사영 카메라 */
function iso(view, target, yawDeg, pitchDeg, dist = 12) {
  const c = new THREE.OrthographicCamera(-view*(W/H)/2, view*(W/H)/2, view/2, -view/2, 0.1, 80)
  const y = yawDeg*Math.PI/180, p = pitchDeg*Math.PI/180
  c.position.set(target.x + dist*Math.cos(p)*Math.sin(y), target.y + dist*Math.sin(p), target.z + dist*Math.cos(p)*Math.cos(y))
  c.lookAt(target)
  return c
}

// 3칸 구성: 대기실(-PITCH) | 복도(0) | 취조실(+PITCH)
function precinct(scene, { side = null } = {}) {
  const wait = makeRoom({ furniture:false, side }); wait.position.x = -PITCH
  const hall = makeRoom({ furniture:false, props:false, tint:0.9, side })
  const intr = makeRoom({ side }); intr.position.x = PITCH
  scene.add(wait, hall, intr)
  const BY = 0.46
  scene.add(bench(-PITCH, -1.25, 2.6, 0.5, BY))
  const xs = [-1.0, -0.5, 0, 0.5, 1.0]
  SITTERS.forEach((s, i) => scene.add(seat(s, -PITCH + xs[i], -1.25, 0, BY)))
  scene.add(player(0, 0.4))
  lights(scene, [-PITCH, 0, PITCH])
  return { }
}

panel('H1  3칸 · yaw45 pitch43 (지금 explore3d 각도) view=12', (s) => { precinct(s); return iso(12, new THREE.Vector3(0,0.6,0), 45, 43) })
panel('H2  3칸 · yaw20 pitch40 view=11  ← 레퍼런스 정면 단면에 가까움', (s) => { precinct(s); return iso(11, new THREE.Vector3(0,0.7,0), 20, 40) })
panel('H3  3칸 · yaw0 pitch35 view=10.5 (완전 정면 · 벽 사라짐 확인)', (s) => { precinct(s); return iso(10.5, new THREE.Vector3(0,0.7,0), 0, 35) })
panel('H4  3칸 · yaw20 pitch40 + FrontSide (근벽 자동 컬링)', (s) => { precinct(s, { side: THREE.FrontSide }); return iso(11, new THREE.Vector3(0,0.7,0), 20, 40) })
panel('H5  대기실만 클로즈업 yaw20 pitch40 view=4.6 (카메라 추종 시)', (s) => { precinct(s); return iso(4.6, new THREE.Vector3(-PITCH,0.7,-0.4), 20, 40) })
L('done')
</script>
