<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chalkboard probe — 녹색 칠판 타임라인 (dev 전용)</title>
<!--
  부품 단독 하네스. 게임 전체에 붙이지 않는다 — 배선은 사람이 한다.
  `npm run dev` 후 http://localhost:5181/probe-chalkboard.html
  · ① 첫 화면(빈 칠판) · ② 진행 중(진술·모순·집힘) · ③ 실제 사건(gc001) 어댑터
-->
<style>
  :root { --bg:#16110f; --ink:#e9e1d3; --muted:#9a8b80; --line:#3d2b2c; --amber:#c8912f;
          --serif: AppleMyungjo, Batang, 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif; }
  * { box-sizing: border-box }
  body { margin:0; padding:18px; background:var(--bg); color:var(--ink);
         font:13px/1.6 'Apple SD Gothic Neo', system-ui, sans-serif }
  h1 { font-family:var(--serif); font-size:16px; margin:0 0 4px; letter-spacing:.5px }
  .lead { color:var(--muted); font-size:12px; margin:0 0 14px }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap }
  button.tool { font:inherit; color:inherit; background:#2a1c20; border:1px solid var(--line);
                border-radius:4px; padding:5px 11px; cursor:pointer }
  button.tool:hover { border-color:var(--amber) }
  button.tool[aria-pressed="true"] { border-color:var(--amber); color:var(--amber) }
  .panel { display:none; max-width:100% }
  .panel.on { display:block }
  .panel.narrow { width:380px }
  .panel h2 { font-family:var(--serif); font-size:13px; color:var(--amber); margin:0 0 4px;
              letter-spacing:.4px; font-weight:400 }
  .panel .why { color:var(--muted); font-size:11.5px; margin:0 0 8px }
  .stage { height:var(--h,600px); max-height:calc(100vh - 190px) }
  #log { margin-top:16px; background:#000; border:1px solid var(--line); border-radius:4px;
         padding:8px 10px; font:11px/1.7 'SF Mono', ui-monospace, Menlo, monospace;
         color:#9fbfa8; max-height:150px; overflow:auto; white-space:pre-wrap }
</style>

<h1>녹색 칠판 타임라인 — 부품 하네스</h1>
<p class="lead">
  <code>src/ui/chalkboard.ts</code> 단독. 게임 상태·전역 <code>ui</code> 없이 인자만으로 선다.
  ③번만 <code>chalkData()</code> 로 실제 사건(gc001)을 읽는다.
</p>

<div class="bar" id="pick"></div>
<div class="bar">
  <span style="color:var(--muted)">폭:</span>
  <button class="tool" id="wide" aria-pressed="true">넓게 (데스크탑)</button>
  <button class="tool" id="narrow" aria-pressed="false">좁게 (모바일 380px)</button>
  <span style="color:var(--muted);margin-left:12px">칸을 누르면 집힌다 · 이름을 누르면 심문 진입 신호</span>
</div>

<div class="panels" id="panels"></div>
<pre id="log">— 조작 로그 —</pre>

<script type="module">
import { renderChalkboard, chalkData } from '/src/ui/chalkboard.ts'
import { gc001Case } from '/src/data/gc001.ts'
import { createGame, interview, claimCardId } from '/src/engine/game.ts'

const L = (s) => { const l = document.getElementById('log'); l.textContent += '\n' + s; l.scrollTop = 1e6 }

/* ── ① 첫 화면 — 아무것도 안 적힌 칠판 ── */
const SLOTS = ['21:00', '21:07', '21:14', '21:21', '21:28']
const WHO = [
  { id: 'S1', name: '윤도경', job: '경비주임' },
  { id: 'S2', name: '한세리', job: '투자자' },
  { id: 'S3', name: '민재훈', job: '감정사' },
  { id: 'S4', name: '오가람', job: '전 동업자' },
  { id: 'S5', name: '정하늘', job: '비서' },
]
const empty = {
  slots: SLOTS.map((label, i) => ({ label, isCrime: i === 2 })),
  suspects: WHO,
  cell: () => ({ place: null, contradicted: false, selected: false }),
}

/* ── ② 진행 중 — 진술 일부 · 어긋남 2건 · 집힘 1칸 ── */
const P = ['로비', '복도', '전시실', '직원계단', '라운지']
const TABLE = [                      // [시각][사람]
  ['로비',  null,   '전시실', null,   '라운지'],
  ['복도',  '로비', '전시실', null,   '라운지'],
  ['복도',  '복도', '전시실', '로비', '라운지'],
  [null,    '복도', null,     '로비', null    ],
  [null,    null,   null,     null,   null    ],
]
const BAD = new Set(['S3:2', 'S1:1'])
const state2 = { sel: new Set(['S5:2']), first: true }
const mid = () => ({
  slots: SLOTS.map((label, i) => ({
    label, isCrime: i === 2,
    note: [null, '기록 1건', '기록 2건', null, null][i] ?? undefined,
  })),
  suspects: WHO.map((w, i) => ({ ...w, cleared: i === 4 })),
  cell: (sid, ti) => {
    const ci = WHO.findIndex((w) => w.id === sid)
    const key = `${sid}:${ti}`
    const bad = BAD.has(key)
    const fresh = bad && state2.first
    return { place: TABLE[ti][ci], contradicted: bad, selected: state2.sel.has(key), fresh }
  },
})

/* ── ③ 실제 사건 — gc001 + 두 명 심문 + 모순 1건 ── */
const CASE = gc001Case()
let g = createGame(CASE)
g = interview(g, 'S1')
g = interview(g, 'S3')
// 엔진이 이미 찾아 둔 모순이 있다고 가정한다 (판정은 여기서 하지 않는다 — 결과만 읽는다)
g = { ...g, foundContradictions: [`${CASE.evidence[0].id}|S1|2`], cards: [...g.cards, CASE.evidence[0].id] }
const state3 = { sel: [], seen: new Set() }
const real = () => chalkData(CASE, g, {
  selected: state3.sel,
  stampedSeen: state3.seen,
  caption: '알리바이 대조표',
  litSuspect: 'S3',
})

/* ── 배치 ── */
const PANELS = [
  { t: '① 첫 화면 — 비어 있는 칠판', why: '중심 행동이 모양으로 보여야 한다. 빈 칸에는 점선 밑줄만 있다 — "여기 적힌다".', data: () => empty, h: 620 },
  { t: '② 진행 중 — 진술 · 어긋남 · 집힘', why: '세로=사람, 가로=시각(3-2-(5)-(2)). 범행 시각 열만 붉은 분필 + 살짝 밝다. 어긋난 칸은 붉은 ✕ 와 "어긋남" 표가 함께 간다. 행에 손을 올리면 그 사람의 밤이 밝아진다.', data: mid, h: 620 },
  { t: '③ chalkData(gc001) — 실제 사건 어댑터', why: '라벨은 전부 slotLabel/placeLabel 을 지난다. 소거·모순은 engine 이 준 값을 읽기만 한다. litSuspect=S3 — 마지막으로 만난 사람의 행이 밝다.', data: real, h: 620 },
]

// 한 번에 한 장만 보여 준다 — 스크롤 없이 한 화면에 들어와야 눈으로 검수가 된다
const host = document.getElementById('panels')
const pick = document.getElementById('pick')
const stages = []
PANELS.forEach((p, i) => {
  const box = document.createElement('div'); box.className = 'panel' + (i === 0 ? ' on' : '')
  const h2 = document.createElement('h2'); h2.textContent = p.t
  const why = document.createElement('p'); why.className = 'why'; why.textContent = p.why
  const stage = document.createElement('div'); stage.className = 'stage'; stage.style.setProperty('--h', p.h + 'px')
  box.append(h2, why, stage); host.appendChild(box)
  stages.push({ p, stage, box })

  const b = document.createElement('button'); b.className = 'tool'
  b.textContent = p.t.split(' — ')[0]
  b.setAttribute('aria-pressed', String(i === 0))
  b.onclick = () => {
    stages.forEach((x, j) => x.box.classList.toggle('on', j === i))
    ;[...pick.children].forEach((c, j) => c.setAttribute('aria-pressed', String(j === i)))
  }
  pick.appendChild(b)
})

function draw() {
  for (const { p, stage } of stages) {
    stage.textContent = ''
    stage.appendChild(renderChalkboard(p.data(), {
      pickCell(s, t) {
        L(`pickCell(${s}, ${t})  · ${p.t}`)
        if (p.data === mid) {
          const k = `${s}:${t}`
          state2.sel.has(k) ? state2.sel.delete(k) : state2.sel.add(k)
          state2.first = false
        }
        if (p.data === real) {
          const id = claimCardId(s, t)
          state3.sel = state3.sel.includes(id) ? state3.sel.filter((x) => x !== id) : [...state3.sel, id]
        }
        draw()
      },
      pickSuspect(s) { L(`pickSuspect(${s})  · ${p.t} — 심문 진입 신호`) },
    }))
  }
}
draw()

const wide = document.getElementById('wide'), narrow = document.getElementById('narrow')
const setW = (n) => {
  for (const { box } of stages) box.classList.toggle('narrow', n)
  wide.setAttribute('aria-pressed', String(!n)); narrow.setAttribute('aria-pressed', String(n))
}
wide.onclick = () => setW(false)
narrow.onclick = () => setW(true)
</script>
