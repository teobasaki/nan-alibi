<!doctype html>
<meta charset="utf-8">
<title>probe</title>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<div id="cv" style="display:flex;gap:6px;flex-wrap:wrap"></div>
<pre id="out"></pre>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js'

const out = document.getElementById('out')
const log = (s) => { out.textContent += s + '\n' }
const draco = new DRACOLoader().setDecoderPath('/draco/')
const loader = new GLTFLoader().setDRACOLoader(draco)
const ROOM_SCALE = 1.9

function view(w, h, clipY) {
  const r = new THREE.WebGLRenderer({ antialias: true })
  r.setSize(w, h); r.outputColorSpace = THREE.SRGBColorSpace
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15
  if (clipY !== undefined) {
    r.localClippingEnabled = true
    r.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), clipY)]
  }
  document.getElementById('cv').appendChild(r.domElement)
  return r
}

async function room() {
  const g = await loader.loadAsync('/room/room.opt.glb')
  const r = g.scene
  r.scale.setScalar(ROOM_SCALE)
  r.position.y = 0.53 * ROOM_SCALE          // ← the line explore3d.ts is missing
  r.traverse(o => { const m = o.material; if (m) (Array.isArray(m)?m:[m]).forEach(x => { x.emissive?.setScalar(0); x.emissiveMap = null; x.clippingPlanes = null }) })
  return r
}
async function char(url) {
  const g = await loader.loadAsync(url)
  g.scene.traverse(o => { const m = o.material; if (m) (Array.isArray(m)?m:[m]).forEach(x => { x.emissive?.setScalar(0); x.emissiveMap = null }) })
  return g
}
function lights(scene) {
  scene.add(new THREE.AmbientLight(0xffd9b0, 0.7))
  const lamp = new THREE.PointLight(0xffcf9a, 18, 8, 2); lamp.position.set(0.05, 1.55, 0.02); scene.add(lamp)
  const d = new THREE.DirectionalLight(0xfff0dd, 1.1); d.position.set(2, 5, 2); scene.add(d)
}
function orthoCam(W, H, v = 3.4) {
  const c = new THREE.OrthographicCamera(-v*(W/H)/2, v*(W/H)/2, v/2, -v/2, 0.1, 40)
  c.position.set(2.6, 3.4, 2.6); c.lookAt(0, 0.55, 0)
  return c
}

const W = 640, H = 420

// ── 1: room offset fixed, NO clipping (ceiling still blocks) ──
{
  const r = view(W, H)
  const s = new THREE.Scene(); s.background = new THREE.Color(0x0d0908)
  s.add(await room()); lights(s)
  const a = (await char('/characters/security.walk.opt.glb')).scene
  a.position.set(0, 0, 0.9); s.add(a)
  r.render(s, orthoCam(W, H))
  log('[1] room y-offset fixed, no clipping  → ceiling still hides everything')
}

// ── 2: offset + clipping plane at y=1.95 (cutaway) ──
{
  const r = view(W, H, 1.95)
  const s = new THREE.Scene(); s.background = new THREE.Color(0x0d0908)
  s.add(await room()); lights(s)
  const a = (await char('/characters/security.walk.opt.glb')).scene
  a.position.set(0, 0, 0.9); s.add(a)
  r.render(s, orthoCam(W, H))
  log('[2] + clippingPlane y<1.95 (ceiling removed)')
}

// ── 3: the actual ask — police-station floor: seated suspects + walking player ──
{
  const clip = 1.95
  const r = view(W * 2, H * 1.5, clip)
  const s = new THREE.Scene(); s.background = new THREE.Color(0x0d0908)
  const rm = await room(); s.add(rm); lights(s)

  // seated suspects dropped straight onto the floor, no per-model tuning
  const SEATS = [
    ['manager',   [-0.55, -0.62], 0],
    ['security',  [ 0.35, -0.62], 0],
    ['investor',  [-0.55,  0.55], Math.PI],
    ['appraiser', [ 0.35,  0.55], Math.PI],
    ['secretary', [ 1.20, -0.10], -Math.PI/2],
  ]
  for (const [slug, p, yaw] of SEATS) {
    const g = await char(`/characters/${slug}.opt.glb`)
    const m = g.scene
    m.position.set(p[0], 0, p[1]); m.rotation.y = yaw
    s.add(m); m.updateMatrixWorld(true)
    const b = new THREE.Box3().setFromObject(m)
    log(`[3] ${slug.padEnd(11)} feet y=${b.min.y.toFixed(3)}  crown y=${b.max.y.toFixed(3)}`)
  }
  const a = (await char('/characters/security.walk.opt.glb')).scene
  a.position.set(-0.2, 0, 1.35); s.add(a)

  const v = 4.6
  const c = new THREE.OrthographicCamera(-v*((W*2)/(H*1.5))/2, v*((W*2)/(H*1.5))/2, v/2, -v/2, 0.1, 40)
  c.position.set(2.6, 3.4, 2.6); c.lookAt(0, 0.55, 0)
  r.render(s, c)
  log('[3] police-station-floor mock: 5 seated + 1 walking, one scene')
}
log('DONE')
</script>
</body>
